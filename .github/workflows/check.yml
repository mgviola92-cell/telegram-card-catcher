name: Python checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_runner
          POSTGRES_PASSWORD: test_password_only
          POSTGRES_DB: cardkout_test_social
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_runner -d cardkout_test_social"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://test_runner:test_password_only@127.0.0.1:5432/cardkout_test_social
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q main.py app scripts tests
      - run: python -m unittest discover -s tests -v
      # Entire identity→review→artwork pipeline stays synthetic/offline.
      - run: python -m scripts.source_pipeline_smoke
      # 50k source-schema snapshot characters through bounded JSON streaming.
      - run: python -m unittest tests.test_anime_offline_stream -v
      # Stream 100k actual normalized synthetic metadata rows offline; no art/Neon.
      - run: python -m unittest tests.test_bulk_metadata_stage -v
      # 10k exact-source-ID artwork leads are pending, never auto-approved.
      - run: python -m unittest tests.test_bulk_artwork_match -v
      # Actual COPY/ON CONFLICT and owned-card preservation in disposable PG.
      - run: python -m unittest tests.test_bulk_url_postgres -v
      # Accept one trusted dataset URL; metadata-only, no network in tests.
      - run: python -m unittest tests.test_bulk_url_dataset -v
      # 100k complete URL rows in ONE streaming source; dry-run uses zero Neon.
      - run: python -m unittest tests.test_bulk_url_import -v
      # Verify one shared generation index; preserve legacy + numeric owners.
      - run: python -m unittest tests.test_ownership_index -v
      # Validate 442 actual upstream image references; never touch image bytes.
      - run: python -m unittest tests.test_wesnoth_source_inventory -v
      # 50k image-free ownership fixtures on disposable PostgreSQL; rollback.
      - run: python -m scripts.benchmark_owned_cards --run --rows 50000
      # 50k synthetic characters with only ONE shared URL field; rollback.
      - run: python -m scripts.benchmark_catalog_storage --run --rows 50000
