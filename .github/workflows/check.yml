name: Python checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_runner
          POSTGRES_PASSWORD: test_password_only
          POSTGRES_DB: cardkout_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_runner -d cardkout_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://test_runner:test_password_only@localhost:5432/cardkout_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q main.py app scripts tests
      - run: python -m unittest discover -s tests -v
