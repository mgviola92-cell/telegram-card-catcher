name: Python checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q main.py app scripts tests
      - run: python -m unittest discover -s tests -v
      # Source review integration is synthetic/offline: no external API or Neon.
      - run: python -m scripts.source_pipeline_smoke
